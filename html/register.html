<div class="wrapper">
    <form>
        <h1>Regisztráció</h1>
        <div class="input-box">
            <label>
                <input type="text" placeholder="Teljesnév" required>
            </label>
        </div>

        <div class="input-box">
            <label>
                <input type="text" placeholder="Felhasználónév" required>
            </label>
        </div>

        <div class="input-box">
            <label>
                <input type="password" placeholder="Jelszó" required>
            </label>
        </div>

        <div class="input-box">
            <label>
                <input type="password" placeholder="Jelszó újra" required>
            </label>
        </div>

        <div class="remember-forgot">
            <label><input type="checkbox">
                Elfogadom az általános szerződési feltételeket
            </label>
        </div>

        <button type="submit" class="btn">Regisztráció</button>



        <div class="login-link">
            <p>Már van fiókod?
                <a href="login.html">Bejelentkezés</a></p>
        </div>

    </form>
</div>
